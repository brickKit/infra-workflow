apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/workflow
  name: Workflow inbox
  version: 2.0.1
  description: A light task inbox; business components register approval and exception tasks, and completion is reported back by event.
  repository: https://github.com/brickKit/infra-workflow
  license: Apache-2.0
  vendor: brickKit

tags: [infra, workflow, approval]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/infra/workflow/v1/workflow.proto, contracts/events/workflow.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/workflow.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: infra_workflow}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8201
  extraPorts:
    - {name: grpc, port: 9201}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 150m, memory: 192Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
