id: infra/workflow                   # 必须与 component.yaml 一致，be-ops 校验

domain: infra
tier: backend

edge_routes:
  - { path: /infra/workflow/**, auth: required }

menus:
  - { key: infra.workflow, title: 我的待办, permission: infra.workflow.task.view }

data:
  schema: infra_workflow               # registry/schemas.tsv
  role:   infra_workflow_rw            # 登录角色，`PG_USER` 的值

data_scopes:
  - { dimension: owner, column: assignee_sub,       mode: equals, tables: [workflow_tasks] }
  - { dimension: org,   column: assignee_dept_path, mode: prefix, tables: [workflow_tasks] }

permissions:
  - { key: infra.workflow.task.view, title: 查看我的待办,   type: page   }
  - { key: infra.workflow.task.act,  title: 处理待办（同意/驳回）, type: action }
  - { key: infra.workflow.admin,     title: 待办全局视图,     type: page   }
